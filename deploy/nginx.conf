# Installed in /etc/nginx/conf.d/default.conf by Dockerfile.catalog.
# TLS and HTTP-to-HTTPS redirects belong to the Coolify proxy, not $scheme in this container.
include /etc/nginx/catalog-map.conf;

# Keep staging and other non-production hostnames out of search results.
map $host $exalco_robots {
    default "noindex, nofollow";
    exalcoaluminium.com "";
    www.exalcoaluminium.com "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag $exalco_robots always;

    if ($host = www.exalcoaluminium.com) {
        return 301 https://exalcoaluminium.com$request_uri;
    }

    # $request_uri is the original URI: / -> index.html internal resolution cannot loop.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 https://exalcoaluminium.com/$is_args$args;
    }

    location = /pages/ { return 301 https://exalcoaluminium.com/pages/products-sr.html; }
    location = /pages { return 301 https://exalcoaluminium.com/pages/products-sr.html; }

    location = /pages/product-detail.html {
        if ($args = "") { return 301 https://exalcoaluminium.com/pages/products.html; }
        try_files $exalco_catalog_page =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $exalco_robots always;
    }
    location = /pages/product-detail-sr.html {
        if ($args = "") { return 301 https://exalcoaluminium.com/pages/products-sr.html; }
        try_files $exalco_catalog_page =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $exalco_robots always;
    }
    location = /pages/products-list.html {
        if ($args = "") { return 301 https://exalcoaluminium.com/pages/products.html; }
        try_files $exalco_catalog_page =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $exalco_robots always;
    }
    location = /pages/products-list-sr.html {
        if ($args = "") { return 301 https://exalcoaluminium.com/pages/products-sr.html; }
        try_files $exalco_catalog_page =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag $exalco_robots always;
    }

    # Generated files are implementation details; only original public URLs may serve them.
    location ^~ /_catalog/ { internal; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
